# nginx reverse proxy for JobHunt Copilot. Copy to /etc/nginx/sites-available/jobhuntcopilot,
# replace __DOMAIN__ with your actual domain (or a "_" catch-all + the droplet's IP if you
# don't have one yet), symlink into sites-enabled, then run `certbot --nginx -d __DOMAIN__`
# to add TLS (it rewrites this file in-place — don't hand-add a `listen 443` block yourself).
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:8420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
