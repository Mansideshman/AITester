# nginx reverse proxy for QABuddyAI. Copy to /etc/nginx/sites-available/qabuddyai,
# replace __DOMAIN__ with your actual domain (or a "_" catch-all + the
# droplet's IP if you don't have one yet), symlink into sites-enabled, then
# run `certbot --nginx -d __DOMAIN__` to add TLS (it rewrites this file
# in-place — don't hand-add a `listen 443` block yourself).
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Uploads (Selenium/Playwright repo files, PDFs) go through
    # POST /api/sources/{type}/upload — nginx's 1MB default is too small.
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/chat and /api/ingest* are Server-Sent Events — nginx buffers
        # proxied responses by default, which would hold back every SSE
        # event until the stream closes instead of forwarding them live.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Ingesting a source (esp. cold-loading bge-m3/reranker the first
        # time) or a long chat rewrite/retrieve/rerank/generate pass can run
        # well past nginx's 60s default — matches qabuddyai-ingest.service's
        # own 3600s ceiling.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
