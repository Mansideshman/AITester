{% extends "base.html" %}
{% block title %}Chunks · Naive RAG Explorer{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Indexed chunks</h1>
  <p>Every chunk stored for retrieval. Coral outline = used in the most recent chat answer.</p>
</div>

<div id="chunk-list"></div>
<div class="card" style="display:flex;justify-content:space-between;align-items:center">
  <button class="btn btn-secondary" id="prev-page" disabled>← Prev</button>
  <span id="page-info" style="color:var(--text-dim);font-size:13px"></span>
  <button class="btn btn-secondary" id="next-page">Next →</button>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/chunks.js"></script>
{% endblock %}
